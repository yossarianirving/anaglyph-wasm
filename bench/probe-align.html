<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>row alignment probe</title></head>
  <body>
    <pre id="out">running…</pre>
    <script>
      addEventListener("unhandledrejection", (e) =>
        (document.getElementById("out").textContent = "REJECT: " + (e.reason?.stack ?? e.reason)));
      addEventListener("error", (e) => (document.getElementById("out").textContent = "ERROR: " + e.message));
    </script>
    <script type="module">
      import {
        ALL_FORMATS, BlobSource, EncodedPacketSink, Input,
      } from "../vendor/mediabunny.mjs";
      import { makeImporter } from "../gpu-video/external.js";

      const outEl = document.getElementById("out");
      const log = {};
      const finish = () => (outEl.textContent = JSON.stringify(log, null, 2));

      const ad = await navigator.gpu.requestAdapter();
      const device = await ad.requestDevice();
      const importExternal = makeImporter(device);
      const W = 480, H = 290; // full coded height

      const input = new Input({ source: new BlobSource(await (await fetch("../bench/booth2s.mp4")).blob()), formats: ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      const cfg = await track.getDecoderConfig();
      const frames = [];
      await new Promise((resolve, reject) => {
        const dec = new VideoDecoder({
          output(f) { frames.push(f); if (frames.length >= 61) resolve(); },
          error: reject,
        });
        dec.configure(cfg);
        (async () => {
          for await (const p of new EncodedPacketSink(track).packets()) {
            dec.decode(p.toEncodedVideoChunk());
            if (frames.length >= 61) break;
          }
          await dec.flush().catch(() => {});
          resolve();
        })().catch(reject);
      });
      const single = frames[60];

      // GPU sample the FULL coded texture with plain uv (0..1 top..bottom)
      // and with flipped uv, into a 480x290 bgra target.
      const module = device.createShaderModule({ code: `
        @group(0) @binding(0) var srcTex: texture_external;
        @group(0) @binding(1) var samp: sampler;
        struct VOut { @builtin(position) pos: vec4<f32>, @location(0) uv: vec2<f32> };
        @vertex fn vs_main(@builtin(vertex_index) vi: u32) -> VOut {
          var p = array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
          var o: VOut; o.pos = vec4<f32>(p[vi],0.,1.); o.uv = (p[vi]+vec2(1.,1.))*0.5; return o;
        }
        @fragment fn fs_direct(in: VOut) -> @location(0) vec4<f32> {
          return textureSampleBaseClampToEdge(srcTex, samp, in.uv);
        }
        @fragment fn fs_flipped(in: VOut) -> @location(0) vec4<f32> {
          return textureSampleBaseClampToEdge(srcTex, samp, vec2<f32>(in.uv.x, 1.0 - in.uv.y));
        }` });
      const sampler = device.createSampler();
      async function gpuSample(entry) {
        const pipe = device.createRenderPipeline({
          layout: "auto",
          vertex: { module, entryPoint: "vs_main" },
          fragment: { module, entryPoint: entry, targets: [{ format: "bgra8unorm" }] },
          primitive: { topology: "triangle-list" },
        });
        const tex = device.createTexture({
          format: "bgra8unorm",
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
          size: [W, H],
        });
        const enc = device.createCommandEncoder();
        const pass = enc.beginRenderPass({ colorAttachments: [{
          view: tex.createView(),
          clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store",
        }]});
        pass.setPipeline(pipe);
        pass.setBindGroup(0, device.createBindGroup({
          layout: pipe.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: importExternal(pass, single) },
            { binding: 1, resource: sampler },
          ],
        }));
        pass.draw(3);
        pass.end();
        const bpr = (W * 4 + 255) & ~255;
        const rb = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
        enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr }, { width: W, height: H });
        device.queue.submit([enc.finish()]);
        await rb.mapAsync(GPUMapMode.READ);
        const buf = new Uint8Array(rb.getMappedRange().slice(0));
        rb.unmap(); rb.destroy(); tex.destroy();
        return { buf, bpr };
      }
      const direct = await gpuSample("fs_direct");
      const flipped = await gpuSample("fs_flipped");

      // drawImage reference into a 480x290 canvas (draws visible 270 at top;
      // bottom 20 rows remain canvas clear color — fill first with magenta
      // so crop-bar vs canvas-clear are distinguishable).
      const di = new OffscreenCanvas(W, H);
      const dctx = di.getContext("2d", { alpha: false, colorSpace: "srgb" });
      dctx.fillStyle = "rgb(255,0,255)";
      dctx.fillRect(0, 0, W, H);
      dctx.drawImage(single, 0, 0);
      const dib = dctx.getImageData(0, 0, W, H).data;

      function stats(getLuma) {
        const rows = [];
        for (let y = 0; y < H; y += 10) {
          let first = -1, last = -1;
          for (let x = 0; x < W; x++) {
            if (getLuma(x, y) < 200) { if (first < 0) first = x; last = x; }
          }
          rows.push(`${y}:${first}-${last}`);
        }
        return rows.join(" ");
      }
      const mkLuma = (buf, bpr) => (x, y) =>
        0.299 * buf[y * bpr + x * 4 + 2] + 0.587 * buf[y * bpr + x * 4 + 1] + 0.114 * buf[y * bpr + x * 4];
      const diLuma = (x, y) =>
        0.299 * dib[(y * W + x) * 4] + 0.587 * dib[(y * W + x) * 4 + 1] + 0.114 * dib[(y * W + x) * 4 + 2];

      log.draw = stats(diLuma);
      log.gpuDirect = stats(mkLuma(direct.buf, direct.bpr));
      log.gpuFlipped = stats(mkLuma(flipped.buf, flipped.bpr));

      // Bottom-bar luma (coded rows 280..289) for each source:
      const rowMean = (get, y) => { let s = 0; for (let x = 0; x < W; x++) s += get(x, y); return +(s / W).toFixed(1); };
      log.barRows = { draw: rowMean(diLuma, 280), gpuDirect: rowMean(mkLuma(direct.buf, direct.bpr), 280), gpuFlipped: rowMean(mkLuma(flipped.buf, flipped.bpr), 280) };

      for (const fr of frames) fr.close();
      input.dispose();
      finish();
    </script>
  </body>
</html>
