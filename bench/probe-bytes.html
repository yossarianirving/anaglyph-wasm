<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>bytes capture probe</title></head>
  <body>
    <pre id="out">running…</pre>
    <script>
      addEventListener("unhandledrejection", (e) =>
        (document.getElementById("out").textContent = "REJECT: " + (e.reason?.stack ?? e.reason)));
      addEventListener("error", (e) => (document.getElementById("out").textContent = "ERROR: " + e.message));
    </script>
    <script type="module">
      import {
        ALL_FORMATS, BlobSource, EncodedPacketSink, Input,
      } from "../vendor/mediabunny.mjs";
      import { makeImporter } from "../gpu-video/external.js";

      const outEl = document.getElementById("out");
      const log = {};
      const finish = () => (outEl.textContent = JSON.stringify(log, null, 2));

      const ad = await navigator.gpu.requestAdapter();
      const device = await ad.requestDevice();
      const importExternal = makeImporter(device);
      const W = 480, H = 270;
      const bpr = (W * 4 + 255) & ~255;
      log.bpr = bpr;

      const input = new Input({ source: new BlobSource(await (await fetch("../bench/booth2s.mp4")).blob()), formats: ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      const cfg = await track.getDecoderConfig();
      const frames = [];
      await new Promise((resolve, reject) => {
        const dec = new VideoDecoder({
          output(f) { frames.push(f); if (frames.length >= 61) resolve(); },
          error: reject,
        });
        dec.configure(cfg);
        (async () => {
          for await (const p of new EncodedPacketSink(track).packets()) {
            dec.decode(p.toEncodedVideoChunk());
            if (frames.length >= 61) break;
          }
          await dec.flush().catch(() => {});
          resolve();
        })().catch(reject);
      });
      const single = frames[60];

      // Render the frame upright (uv-top) into a bgra target + readback.
      const module = device.createShaderModule({ code: `
        @group(0) @binding(0) var srcTex: texture_external;
        @group(0) @binding(1) var samp: sampler;
        struct VOut { @builtin(position) pos: vec4<f32>, @location(0) uv: vec2<f32> };
        @vertex fn vs_top(@builtin(vertex_index) vi: u32) -> VOut {
          var p = array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
          var o: VOut; o.pos = vec4<f32>(p[vi],0.,1.);
          o.uv = vec2<f32>((p[vi].x + 1.0) * 0.5, (1.0 - p[vi].y) * 0.5);
          return o;
        }
        @fragment fn fs_main(in: VOut) -> @location(0) vec4<f32> {
          return textureSampleBaseClampToEdge(srcTex, samp, in.uv);
        }` });
      const pipe = device.createRenderPipeline({
        layout: "auto",
        vertex: { module, entryPoint: "vs_top" },
        fragment: { module, entryPoint: "fs_main", targets: [{ format: "bgra8unorm" }] },
        primitive: { topology: "triangle-list" },
      });
      const tex = device.createTexture({
        format: "bgra8unorm",
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
        size: [W, H],
      });
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{
        view: tex.createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store",
      }]});
      pass.setPipeline(pipe);
      pass.setBindGroup(0, device.createBindGroup({
        layout: pipe.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: importExternal(pass, single) },
          { binding: 1, resource: device.createSampler() },
        ],
      }));
      pass.draw(3);
      pass.end();
      const rb = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr }, { width: W, height: H });
      device.queue.submit([enc.finish()]);
      await rb.mapAsync(GPUMapMode.READ);
      const raw = new Uint8Array(rb.getMappedRange().slice(0));
      rb.unmap(); rb.destroy();

      // Sanity: raw readback row 0 vs row at y=120 at x=240.
      const spot = (buf, stride, x, y) => {
        const i = y * stride + x * 4;
        return [buf[i + 2], buf[i + 1], buf[i]];
      };
      log.rawSpots = {
        "120,240": spot(raw, bpr, 240, 120),
        "150,165": spot(raw, bpr, 165, 150),
        "10,10": spot(raw, bpr, 10, 10),
      };

      // Path A: VideoFrame(bytes) with bytesPerRow -> copyTo back.
      try {
        const vfA = new VideoFrame(raw, {
          format: "BGRA", codedWidth: W, codedHeight: H, bytesPerRow: bpr,
          timestamp: 0, alphaMode: "discard",
        });
        log.vfA = { coded: [vfA.codedWidth, vfA.codedHeight], format: vfA.format };
        const back = new Uint8Array(vfA.codedWidth * vfA.codedHeight * 4);
        await vfA.copyTo(back, { colorSpaceConversion: "ignore" });
        log.vfA_backSpots = {
          "120,240": spot(back, W * 4, 240, 120),
          "150,165": spot(back, W * 4, 165, 150),
        };
        // draw to 2D canvas and check pixel
        const c = new OffscreenCanvas(W, H);
        const cx = c.getContext("2d", { alpha: false });
        cx.drawImage(vfA, 0, 0);
        const d = cx.getImageData(240, 120, 1, 1).data;
        log.vfA_canvasSpot = [d[0], d[1], d[2]];
        vfA.close();
      } catch (e) {
        log.vfA = "FAIL: " + e.message;
      }

      // Path B: compact copy to packed rows, then VideoFrame(bytes) no bpr.
      try {
        const packed = new Uint8Array(W * 4 * H);
        for (let y = 0; y < H; y++) packed.set(raw.subarray(y * bpr, y * bpr + W * 4), y * W * 4);
        const vfB = new VideoFrame(packed, {
          format: "BGRA", codedWidth: W, codedHeight: H,
          timestamp: 0, alphaMode: "discard",
        });
        const c = new OffscreenCanvas(W, H);
        const cx = c.getContext("2d", { alpha: false });
        cx.drawImage(vfB, 0, 0);
        const d = cx.getImageData(240, 120, 1, 1).data;
        log.vfB_canvasSpot = [d[0], d[1], d[2]];
        vfB.close();
      } catch (e) {
        log.vfB = "FAIL: " + e.message;
      }

      for (const fr of frames) fr.close();
      input.dispose();
      finish();
    </script>
  </body>
</html>
