<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>external texture dims probe</title></head>
  <body>
    <pre id="out">running…</pre>
    <script>
      addEventListener("unhandledrejection", (e) =>
        (document.getElementById("out").textContent = "REJECT: " + (e.reason?.stack ?? e.reason)));
      addEventListener("error", (e) => (document.getElementById("out").textContent = "ERROR: " + e.message));
    </script>
    <script type="module">
      import {
        ALL_FORMATS, BlobSource, EncodedPacketSink, Input,
      } from "../vendor/mediabunny.mjs";
      import { makeImporter } from "../gpu-video/external.js";

      const outEl = document.getElementById("out");
      const log = {};
      const finish = () => (outEl.textContent = JSON.stringify(log, null, 2));

      const ad = await navigator.gpu.requestAdapter();
      const device = await ad.requestDevice();
      const importExternal = makeImporter(device);

      const input = new Input({ source: new BlobSource(await (await fetch("../bench/booth2s.mp4")).blob()), formats: ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      const cfg = await track.getDecoderConfig();
      const frames = [];
      await new Promise((resolve, reject) => {
        const dec = new VideoDecoder({
          output(f) { frames.push(f); if (frames.length >= 61) resolve(); },
          error: reject,
        });
        dec.configure(cfg);
        (async () => {
          for await (const p of new EncodedPacketSink(track).packets()) {
            dec.decode(p.toEncodedVideoChunk());
            if (frames.length >= 61) break;
          }
          await dec.flush().catch(() => {});
          resolve();
        })().catch(reject);
      });
      const single = frames[60];
      log.frame = { coded: [single.codedWidth, single.codedHeight], visible: single.visibleRect ? [single.visibleRect.x, single.visibleRect.y, single.visibleRect.width, single.visibleRect.height] : null };

      const module = device.createShaderModule({ code: `
        @group(0) @binding(0) var srcTex: texture_external;
        @group(0) @binding(1) var samp: sampler;
        struct VOut { @builtin(position) pos: vec4<f32>, @location(0) uv: vec2<f32> };
        @vertex fn vs_main(@builtin(vertex_index) vi: u32) -> VOut {
          var p = array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
          var o: VOut; o.pos = vec4<f32>(p[vi],0.,1.); o.uv = (p[vi]+vec2(1.,1.))*0.5; return o;
        }
        // Encode textureDimensions into bytes at every pixel:
        // R=x%256 G=x/256 B=y%256 A=y/256
        @fragment fn fs_dims(in: VOut) -> @location(0) vec4<f32> {
          let d = textureDimensions(srcTex);
          return vec4<f32>(f32(d.x % 256u), f32(d.x / 256u), f32(d.y % 256u), f32(d.y / 256u));
        }
        @fragment fn fs_raw(in: VOut) -> @location(0) vec4<f32> {
          return textureSampleBaseClampToEdge(srcTex, samp, in.uv);
        }` });
      const ci = await module.getCompilationInfo();
      if (ci.messages.length) log.moduleCompile = ci.messages.map((m) => m.type + ": " + m.message);

      async function renderTo(module_entry, w, h, extraEntries) {
        const pipe = device.createRenderPipeline({
          layout: "auto",
          vertex: { module, entryPoint: "vs_main" },
          fragment: { module, entryPoint: module_entry, targets: [{ format: "bgra8unorm" }] },
          primitive: { topology: "triangle-list" },
        });
        const tex = device.createTexture({
          format: "bgra8unorm",
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
          size: [w, h],
        });
        const enc = device.createCommandEncoder();
        const pass = enc.beginRenderPass({ colorAttachments: [{
          view: tex.createView(),
          clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store",
        }]});
        pass.setPipeline(pipe);
        pass.setBindGroup(0, device.createBindGroup({
          layout: pipe.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: importExternal(pass, single) },
            ...(module_entry === "fs_dims" ? [] : [{ binding: 1, resource: device.createSampler() }]),
            ...(extraEntries || []),
          ],
        }));
        pass.draw(3);
        pass.end();
        const bpr = (w * 4 + 255) & ~255;
        const rb = device.createBuffer({ size: bpr * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
        enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr }, { width: w, height: h });
        device.queue.submit([enc.finish()]);
        await rb.mapAsync(GPUMapMode.READ);
        const buf = new Uint8Array(rb.getMappedRange().slice(0));
        rb.unmap(); rb.destroy(); tex.destroy();
        return { buf, bpr };
      }

      // 1. Dimensions of the imported external texture.
      const dimsR = await renderTo("fs_dims", 4, 4);
      const txW = dimsR.buf[0] + dimsR.buf[1] * 256;
      const txH = dimsR.buf[2] + dimsR.buf[3] * 256;
      log.textureDimensions = [txW, txH];
      if (txH === 0) { finish(); throw new Error("dims read failed"); }

      // 2. Raw content sampled over full uv into a texture-DIMS-sized target.
      const raw = await renderTo("fs_raw", txW, txH);
      const lum = (x, y) =>
        0.299 * raw.buf[y * raw.bpr + x * 4 + 2] + 0.587 * raw.buf[y * raw.bpr + x * 4 + 1] + 0.114 * raw.buf[y * raw.bpr + x * 4];
      const rowMean = (y) => { let s = 0; for (let x = 0; x < txW; x += 4) s += lum(x, y); return +(s / Math.ceil(txW / 4)).toFixed(1); };
      log.rawRowMeans_head = [];
      for (let y = 0; y < Math.min(15, txH); y++) log.rawRowMeans_head.push(y + ":" + rowMean(y));
      log.rawRowMeans_tail = [];
      for (let y = Math.max(0, txH - 25); y < txH; y++) log.rawRowMeans_tail.push(y + ":" + rowMean(y));
      // Content rows (rowMean < 250) first/last
      let cFirst = -1, cLast = -1, darkFirst = -1, darkLast = -1;
      for (let y = 0; y < txH; y++) {
        const m = rowMean(y);
        if (m < 250) { if (cFirst < 0) cFirst = y; cLast = y; }
        if (m < 50) { if (darkFirst < 0) darkFirst = y; darkLast = y; }
      }
      log.rawContentRows = [cFirst, cLast];
      log.rawDarkRows = [darkFirst, darkLast];

      for (const fr of frames) fr.close();
      input.dispose();
      finish();
    </script>
  </body>
</html>
