<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <main class="container">
            <form id="gifForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="gifFile" class="form-label">Upload GIF:</label>
                    <input
                        type="file"
                        class="form-control"
                        id="gifFile"
                        name="gifFile"
                        accept="image/gif"
                    />
                </div>

                <div class="mb-3">
                    <label for="videoDirection" class="form-label"
                        >Video Direction:</label
                    >
                    <select class="form-select" id="videoDirection">
                        <option value="clockwise">Clockwise</option>
                        <option value="counter-clockwise">
                            Counter-Clockwise
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="anaglyphType" class="form-label"
                        >Anaglyph Color Type:</label
                    >
                    <select class="form-select" id="anaglyphType">
                        <option value="color">Color</option>
                        <option value="half-color">Half-Color</option>
                        <option value="grayscale">Grayscale</option>
                        <option value="optimized">Optimized</option>
                        <option value="true">True</option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submit"
                    disabled
                >
                    Submit
                </button>
            </form>

            <img id="resultGif" style="display: none; max-width: 95%" />
        </main>
        <script type="module">
            import init, { Anaglyph } from "./pkg/anaglyph_wasm.js";
            var anaglyph;
            var worker = new Worker("anaglyph-worker.js", { type: "module" });

            worker.onmessage = function (e) {
                switch (e.data.type) {
                    case "anaglyph-result-gif":
                        var url = e.data.url;
                        var resultGif = document.getElementById("resultGif");
                        resultGif.src = url;
                        resultGif.style.display = "block";
                        document.getElementById("submit").disabled = false;

                        break;
                    case "gif-loaded":
                        document.getElementById("submit").disabled = false;
                        break;
                    case "ready":
                        document.getElementById("submit").disabled = false;
                        break;
                }
            };

            async function run() {
                document.getElementById("submit").disabled = true;
                await init();
                anaglyph = Anaglyph.new();
            }
            run();

            document
                .getElementById("gifFile")
                .addEventListener("change", function (e) {
                    document.getElementById("submit").disabled = true;
                    worker.postMessage({
                        type: "uploadGif",
                        gif: e.target.files[0],
                    });
                });

            document
                .getElementById("gifForm")
                .addEventListener("submit", function (event) {
                    event.preventDefault();
                    document.getElementById("submit").disabled = true;
                    var videoDirection =
                        document.getElementById("videoDirection").value;
                    var anaglyphType =
                        document.getElementById("anaglyphType").value;
                    worker.postMessage({
                        type: "anaglyph-submit-gif",
                        videoDirection: videoDirection,
                        anaglyphType: anaglyphType,
                    });
                });
        </script>
    </body>
</html>
