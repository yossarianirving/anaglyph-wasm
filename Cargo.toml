[package]
name = "anaglyph-wasm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anaglyph-rs = { git = "https://github.com/yossarianirving/anaglyph-rs.git"}
# `gpu` (off by default; see [features]) switches gif blending to the
# WebGPU compute path: gif_to_anaglyph_async then runs frames through
# convert_gif_buffer_to_anaglyph_async with a CPU fallback.
# Local co-development: keep a sibling checkout and use an uncommitted
# cargo `paths = ["../anaglyph-rs"]` override instead of the tag.
#anaglyph-rs = { path = "../anaglyph-rs" }
image = { version = "0.25.5", features = ["gif"] }
js-sys = "0.3"
# Pinned exactly: the pkg/ JS glue must be produced by the matching
# wasm-bindgen CLI (scripts/build-wasm.sh enforces this).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3.4"
features = [
  'console'
]

[features]
default = []
# WebGPU blending for gifs, currently off while we evaluate its impact
# (see bench.html: on SwiftShader the GPU path measured slower than CPU).
# Re-enable with: wasm-pack build --target web --release --features gpu
gpu = ["anaglyph-rs/gpu"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
#opt-level=3
lto=true


[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
#debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = false
#omit-default-module-path = false
wasm-opt = ["-O4", "-g"]
