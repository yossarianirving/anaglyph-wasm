<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />
        <title>Video pipeline benchmark</title>
    </head>
    <body>
        <main class="container py-3" style="max-width: 60rem">
            <p>
                <a href="video.html">video converter</a> &middot;
                <a href="bench.html">gif bench</a>
            </p>
            <h1>Video pipeline benchmark</h1>
            <p class="text-muted">
                Times the full WebCodecs pipeline (demux &rarr; decode &rarr;
                pair &rarr; blend &rarr; encode &rarr; mux), plus isolated
                decode-only and blend-only upper bounds. First iteration
                includes warm-up costs; the harness reports medians.
            </p>

            <form id="benchForm" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="clip">Clip</label>
                    <select class="form-select" id="clip">
                        <option value="bench/booth2s.mp4">booth2s (5.7s)</option>
                        <option value="bench/booth2s-aac.mp4">
                            booth2s-aac (5.7s)
                        </option>
                        <option value="bench/boomerang.mp4">
                            boomerang (11.3s)
                        </option>
                        <option value="bench/booth2s-vp9.webm">
                            booth2s VP9/WebM (Firefox-safe)
                        </option>
                        <option value="bench/boomerang-vp9.webm">
                            boomerang VP9/WebM (Firefox-safe)
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="direction">Direction</label>
                    <select class="form-select" id="direction">
                        <option value="clockwise">clockwise</option>
                        <option value="auto">auto</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="backend">Blend backend</label>
                    <select class="form-select" id="backend">
                        <option value="cpu">cpu (SIMD)</option>
                        <option value="auto">auto (WebGPU if present)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="iters">Iterations</label>
                    <input
                        class="form-control"
                        id="iters"
                        type="number"
                        min="1"
                        max="20"
                        value="3"
                    />
                </div>
                <div class="col-md-4">
                    <label class="form-label d-block">Codecs / latency</label>
                    <div class="form-check form-check-inline">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="hwDecode"
                            checked
                        />
                        <label class="form-check-label" for="hwDecode"
                            >HW decode</label
                        >
                    </div>
                    <div class="form-check form-check-inline">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="hwEncode"
                            checked
                        />
                        <label class="form-check-label" for="hwEncode"
                            >HW encode</label
                        >
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label me-1" for="latency"
                            >latency</label
                        >
                        <select class="form-select form-select-sm d-inline-block w-auto" id="latency">
                            <option value="quality">quality</option>
                            <option value="realtime">realtime</option>
                        </select>
                    </div>
                    <div class="form-check form-check-inline">
                        <label class="form-check-label me-1" for="codec"
                            >codec</label
                        >
                        <select class="form-select form-select-sm d-inline-block w-auto" id="codec">
                            <option value="">auto</option>
                            <option value="avc">avc</option>
                            <option value="vp9">vp9</option>
                            <option value="vp8">vp8</option>
                            <option value="av1">av1</option>
                        </select>
                    </div>
                </div>
                <div class="col-12 mt-2">
                    <button type="submit" class="btn btn-primary" id="run">
                        Run
                    </button>
                    <span id="status" class="ms-2 text-muted" aria-live="polite"></span>
                </div>
            </form>

            <table
                class="table table-sm table-striped mt-3"
                id="results"
                style="display: none"
            ></table>
            <pre id="json" class="bg-light p-2 small" style="display: none"></pre>
        </main>
        <script type="module">
            import init, { MotionAnalyzer, Tracker, VideoBlender, YuvFrameConverter } from "./pkg/anaglyph_wasm.js";
            import { convertVideoToAnaglyph, planEncoder } from "./js/video-pipeline.js";
            import {
                ALL_FORMATS,
                BlobSource,
                EncodedPacketSink,
                Input,
            } from "./vendor/mediabunny.mjs";

            const statusEl = document.getElementById("status");
            const resultsEl = document.getElementById("results");
            const jsonEl = document.getElementById("json");

            /** Collected result of the most recent run (Playwright reads this). */
            window.__benchResults = null;

            await init();

            // Auto-start support for the automation harness:
            //   bench-video.html?clip=bench/booth2s.mp4&iters=3&backend=cpu&autorun=1
            // Optional: &hwDecode=0&hwEncode=0&latency=realtime
            const params = new URLSearchParams(location.search);
            if (params.get("autorun")) {
                if (params.get("clip")) document.getElementById("clip").value = params.get("clip");
                if (params.get("direction")) document.getElementById("direction").value = params.get("direction");
                if (params.get("backend")) document.getElementById("backend").value = params.get("backend");
                if (params.get("iters")) document.getElementById("iters").value = params.get("iters");
                if (params.get("hwDecode")) document.getElementById("hwDecode").checked = params.get("hwDecode") !== "0";
                if (params.get("hwEncode")) document.getElementById("hwEncode").checked = params.get("hwEncode") !== "0";
                if (params.get("latency")) document.getElementById("latency").value = params.get("latency");
                if (params.get("codec")) document.getElementById("codec").value = params.get("codec");
                runBenchmark();
            }

            document.getElementById("benchForm").addEventListener("submit", (e) => {
                e.preventDefault();
                runBenchmark();
            });

            async function fetchSample(url) {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`could not load ${url}`);
                const blob = await response.blob();
                return new File([blob], url.split("/").pop(), { type: blob.type });
            }

            /** createBlender for the pipeline; backend "cpu" skips the GPU probe. */
            function makeCreateBlender(backend) {
                return async (width, height, anaglyphType, pipelineBackend) => {
                    const blender = await VideoBlender.new(
                        width,
                        height,
                        anaglyphType,
                        backend === "cpu" || pipelineBackend === "cpu" ? "cpu" : null,
                    );
                    return blender;
                };
            }

            /** Same tracker factory as the production worker. */
            async function makeTracker(width, height, reverse) {
                const analyzer = MotionAnalyzer.new(width, height);
                const tracker = new Tracker(reverse);
                return {
                    tracker: {
                        push: (index, timeSecs, dx, reliable) =>
                            tracker.push(index, timeSecs, dx, reliable),
                        confirmedThrough: () => tracker.confirmed_through(),
                        currentDirection: () => tracker.current_direction(),
                        finish: () => tracker.finish(),
                        takeReversals: () => tracker.take_reversals(),
                    },
                    observe: (frame) => ({
                        dx: analyzer.observe_rgba(new Uint8Array(frame.rgba)),
                        reliable: analyzer.is_reliable(),
                    }),
                };
            }

            /** Decode the whole clip, discard every frame: upper bound. */
            async function benchDecode(file) {
                const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
                try {
                    const track = await input.getPrimaryVideoTrack();
                    const config = await track.getDecoderConfig();
                    let frames = 0;
                    let decoderError = null;
                    const decoder = new VideoDecoder({
                        output(frame) {
                            frames += 1;
                            frame.close();
                        },
                        error(e) {
                            decoderError = e;
                        },
                    });
                    decoder.configure(config);
                    const started = performance.now();
                    const sink = new EncodedPacketSink(track);
                    for await (const packet of sink.packets()) {
                        if (decoderError) throw decoderError;
                        decoder.decode(packet.toEncodedVideoChunk());
                        while (decoder.decodeQueueSize > 32) {
                            await new Promise((r) =>
                                decoder.addEventListener("dequeue", r, { once: true }),
                            );
                        }
                    }
                    await decoder.flush();
                    decoder.close();
                    if (decoderError) throw decoderError;
                    const seconds = (performance.now() - started) / 1e3;
                    return { frames, seconds, fps: frames / seconds };
                } finally {
                    input.dispose();
                }
            }

            /** Pure blend throughput on synthetic frames (no codecs). */
            async function benchBlend(width, height, backend, frames) {
                const blender = await VideoBlender.new(
                    width,
                    height,
                    "color",
                    backend === "cpu" ? "cpu" : null,
                );
                const a = new Uint8Array(width * height * 4).fill(120);
                const b = new Uint8Array(width * height * 4).fill(90);
                const started = performance.now();
                for (let i = 0; i < frames; i++) await blender.blend(a, b);
                const seconds = (performance.now() - started) / 1e3;
                const gpu = blender.is_gpu();
                blender.free();
                return { frames, seconds, fps: frames / seconds, gpu };
            }

            /**
             * Pure encode throughput: feed synthetic-but-textured RGBA frames
             * straight into the planned encoder (no demux/decode/copy/blend).
             * Distinguishes a slow encoder from slow submission plumbing —
             * Firefox runs its H.264 encoder in a GMP process and some per-
             * frame cost there never shows up in the other stage timings.
             */
            async function benchEncode({ width, height, frameRate, acceleration, encoderLatencyMode, encoderCodec }, frames) {
                const plan = await planEncoder(
                    width,
                    height,
                    frameRate,
                    acceleration.encode,
                    encoderLatencyMode,
                    encoderCodec,
                );
                if (!plan) return null;
                const data = new Uint8Array(width * height * 4);
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = (i * 7) & 0xff;
                    data[i + 1] = (i * 13) & 0xff;
                    data[i + 2] = (i * 29) & 0xff;
                    data[i + 3] = 255;
                }
                let encodedFrames = 0;
                let encoderError = null;
                const encoder = new VideoEncoder({
                    output() {
                        encodedFrames += 1;
                    },
                    error(e) {
                        encoderError = e;
                    },
                });
                encoder.configure(plan.encoderConfig);
                const started = performance.now();
                for (let i = 0; i < frames; i++) {
                    const frame = new VideoFrame(data, {
                        format: "RGBA",
                        codedWidth: width,
                        codedHeight: height,
                        timestamp: Math.round((i * 1e6) / frameRate),
                        alphaMode: "discard",
                    });
                    encoder.encode(frame, { keyFrame: i % 60 === 0 });
                    frame.close();
                    while (encoder.encodeQueueSize > 16) {
                        await new Promise((r) =>
                            encoder.addEventListener("dequeue", r, { once: true }),
                        );
                    }
                }
                await encoder.flush();
                encoder.close();
                if (encoderError) throw encoderError;
                const seconds = (performance.now() - started) / 1e3;
                return {
                    frames: encodedFrames,
                    seconds,
                    fps: encodedFrames / seconds,
                    codec: plan.codec,
                    accel: plan.accel,
                };
            }

            /**
             * Pure motion-analysis throughput: the wasm block matcher
             * (`MotionAnalyzer.observe_rgba` + `Tracker.push`) on synthetic
             * shifted frames with no codecs involved. This is what `auto`
             * mode adds on top of a fixed pairing, and — because it is the
             * one stage dominated by raw wasm throughput — the stage where
             * per-engine JIT differences show up widest.
             */
            async function benchMotion({ width, height }, frames) {
                const analyzer = MotionAnalyzer.new(width, height);
                const tracker = new Tracker(false);
                const data = new Uint8Array(width * height * 4);
                // Textured block noise: the matcher discards low-variance
                // blocks, so flat synthetic frames would benchmark a no-op.
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const o = (y * width + x) * 4;
                        const v = ((x >> 3) * 37 + (y >> 3) * 91 + ((x ^ y) & 7) * 13) & 0xff;
                        data[o] = v;
                        data[o + 1] = (v * 3) & 0xff;
                        data[o + 2] = (v >> 1) & 0xff;
                        data[o + 3] = 255;
                    }
                }
                const started = performance.now();
                for (let i = 0; i < frames; i++) {
                    // Slide the texture by 4 px per frame (wrap included):
                    // keeps the matcher's inner loop fully busy.
                    data.copyWithin(0, 16);
                    const dx = analyzer.observe_rgba(data);
                    tracker.push(i, i / 30, dx, analyzer.is_reliable());
                }
                const seconds = (performance.now() - started) / 1e3;
                return { frames, seconds, fps: frames / seconds };
            }

            async function runBenchmark() {
                const clip = document.getElementById("clip").value;
                const direction = document.getElementById("direction").value;
                const backend = document.getElementById("backend").value;
                const iters = parseInt(document.getElementById("iters").value, 10) || 3;
                const acceleration = {
                    decode: document.getElementById("hwDecode").checked,
                    encode: document.getElementById("hwEncode").checked,
                    webgpu: backend !== "cpu",
                };
                const encoderLatencyMode = document.getElementById("latency").value;
                const encoderCodec = document.getElementById("codec").value || null;
                const runButton = document.getElementById("run");

                runButton.disabled = true;
                window.__benchResults = null;
                const file = await fetchSample(clip);
                const perIteration = [];
                let lastError = null;

                for (let i = 0; i < iters; i++) {
                    statusEl.textContent = `iteration ${i + 1}/${iters}…`;
                    try {
                        const started = performance.now();
                        const result = await convertVideoToAnaglyph({
                            file,
                            direction,
                            anaglyphType: "color",
                            acceleration,
                            encoderLatencyMode,
                            encoderCodec,
                            createBlender: makeCreateBlender(backend),
                            createYuvConverter: (planeBytes, width, height) => {
                                const c = new YuvFrameConverter(planeBytes, width, height);
                                return {
                                    planesView: () => c.planesView(),
                                    convert: (g) =>
                                        c.convert(
                                            g.yOffset, g.yStride, g.uvOffset, g.uvStride, g.vOffset,
                                            g.x, g.y, g.width, g.height, g.planar, g.bt709,
                                        ),
                                    dstView: () => c.dstView(),
                                };
                            },
                            createTracker: direction.startsWith("auto")
                                ? (w, h, reverse) => makeTracker(w, h, reverse)
                                : undefined,
                        });
                        perIteration.push({
                            fps: result.report.fps,
                            seconds: result.report.seconds,
                            frames: result.report.frames,
                            sourceWidth: result.report.width,
                            sourceHeight: result.report.height,
                            output: result.report.output,
                            rotation: result.report.rotation,
                            blender: result.report.blender,
                            frameCopy: result.report.frameCopy,
                            encoder: result.report.encoder,
                            decoder: result.report.decoder,
                            stageMs: result.stageMs,
                            outputBytes: result.blob.size,
                            wallSeconds: (performance.now() - started) / 1e3,
                        });
                    } catch (err) {
                        lastError = String(err && err.message ? err.message : err);
                        break;
                    }
                }

                let decodeOnly = null;
                let blendOnly = null;
                let encodeOnly = null;
                let motionOnly = null;
                if (!lastError && perIteration.length > 0) {
                    statusEl.textContent = "decode-only…";
                    decodeOnly = await benchDecode(file);
                    statusEl.textContent = "blend-only…";
                    const dims = perIteration[0];
                    blendOnly = await benchBlend(
                        dims.sourceWidth & ~1,
                        dims.sourceHeight & ~1,
                        backend,
                        Math.max(120, dims.frames || 180),
                    );
                    statusEl.textContent = "encode-only…";
                    try {
                        encodeOnly = await benchEncode(
                            {
                                width: dims.sourceWidth & ~1,
                                height: dims.sourceHeight & ~1,
                                frameRate: 30,
                                acceleration,
                                encoderLatencyMode,
                                encoderCodec,
                            },
                            Math.max(120, dims.frames || 180),
                        );
                    } catch (err) {
                        encodeOnly = { error: String(err && err.message ? err.message : err) };
                    }
                    statusEl.textContent = "motion-only…";
                    try {
                        motionOnly = await benchMotion(
                            {
                                width: dims.sourceWidth & ~1,
                                height: dims.sourceHeight & ~1,
                            },
                            Math.max(120, dims.frames || 180),
                        );
                    } catch (err) {
                        motionOnly = { error: String(err && err.message ? err.message : err) };
                    }
                }

                const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
                let gpu = "no adapter";
                if (adapter) {
                    const info = adapter.info ?? (await adapter.requestAdapterInfo?.().catch(() => null));
                    gpu = info ? `${info.vendor} ${info.architecture ?? ""}`.trim() : "adapter present";
                }

                window.__benchResults = {
                    clip,
                    direction,
                    backend,
                    acceleration,
                    encoderLatencyMode,
                    encoderCodec,
                    iters: perIteration,
                    decodeOnly,
                    blendOnly,
                    encodeOnly,
                    motionOnly,
                    error: lastError,
                    meta: {
                        userAgent: navigator.userAgent,
                        webgpu: gpu,
                        deviceMemory: navigator.deviceMemory ?? null,
                        hardwareConcurrency: navigator.hardwareConcurrency ?? null,
                    },
                };

                renderTable(window.__benchResults);
                statusEl.textContent = lastError ? `Failed: ${lastError}` : "done.";
                runButton.disabled = false;
            }

            function renderTable(results) {
                resultsEl.innerHTML = "";
                resultsEl.style.display = "table";
                const header = resultsEl.insertRow();
                for (const title of [
                    "iter",
                    "pairs",
                    "fps",
                    "copy ms",
                    "blend ms",
                    "motion ms",
                    "enc-wait ms",
                    "dec-wait ms",
                    "blend backend",
                    "encoder",
                    "out MB",
                ]) {
                    header.appendChild(document.createElement("th")).textContent = title;
                }
                results.iters.forEach((run, index) => {
                    const row = resultsEl.insertRow();
                    const cell = (value) => row.insertCell().textContent = value;
                    cell(String(index + 1));
                    cell(String(run.frames));
                    cell(run.fps.toFixed(1));
                    cell(String(Math.round(run.stageMs.copy)));
                    cell(String(Math.round(run.stageMs.blend)));
                    cell(String(Math.round(run.stageMs.motion ?? 0)));
                    cell(String(Math.round(run.stageMs.encodeWait)));
                    cell(String(Math.round(run.stageMs.decodeWait)));
                    cell(run.blender);
                    cell(run.encoder);
                    cell((run.outputBytes / 1e6).toFixed(2));
                });
                if (results.decodeOnly) {
                    const row = resultsEl.insertRow();
                    row.insertCell().textContent = "—";
                    row.insertCell().textContent = String(results.decodeOnly.frames);
                    row.insertCell().textContent = results.decodeOnly.fps.toFixed(1);
                    row.insertCell().colSpan = 6;
                    row.insertCell().textContent = "decode-only";
                }
                if (results.blendOnly) {
                    const row = resultsEl.insertRow();
                    row.insertCell().textContent = "—";
                    row.insertCell().textContent = String(results.blendOnly.frames);
                    row.insertCell().textContent = results.blendOnly.fps.toFixed(1);
                    row.insertCell().colSpan = 6;
                    row.insertCell().textContent = `blend-only (${results.blendOnly.gpu ? "GPU" : "CPU"})`;
                }
                if (results.motionOnly && !results.motionOnly.error) {
                    const row = resultsEl.insertRow();
                    row.insertCell().textContent = "—";
                    row.insertCell().textContent = String(results.motionOnly.frames);
                    row.insertCell().textContent = results.motionOnly.fps.toFixed(1);
                    row.insertCell().colSpan = 6;
                    row.insertCell().textContent = "motion-only (wasm block match)";
                }
                if (results.encodeOnly && !results.encodeOnly.error) {
                    const row = resultsEl.insertRow();
                    row.insertCell().textContent = "—";
                    row.insertCell().textContent = String(results.encodeOnly.frames);
                    row.insertCell().textContent = results.encodeOnly.fps.toFixed(1);
                    row.insertCell().colSpan = 6;
                    row.insertCell().textContent = `encode-only (${results.encodeOnly.codec})`;
                } else if (results.encodeOnly) {
                    const row = resultsEl.insertRow();
                    row.insertCell().textContent = "—";
                    row.insertCell().colSpan = 3;
                    row.insertCell().textContent = `encode-only failed: ${results.encodeOnly.error}`;
                }
                jsonEl.style.display = "block";
                jsonEl.textContent = JSON.stringify(results, null, 2);
            }
        </script>
    </body>
</html>
